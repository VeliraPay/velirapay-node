name: tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check the package's metadata
        if: matrix.node == '26'
        run: npx --yes publint@0.3.25 --strict

      - name: Check the types each entry point resolves to
        if: matrix.node == '26'
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .
